name: PR quality gate

env:
  SOURCE_DATE_EPOCH: '1787270400'

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chatgpt-bridge:
    name: Dropbox bridge authorization, encryption and immutable delivery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==50.0.1
      - run: python -m unittest discover -s tests/bridge -v
  title-image-raster:
    name: Real Linux title-image rasterization
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
        id: chrome
        with:
          chrome-version: "152.0.7977.82"
      - name: Exercise real title-image output repeatedly without paid generation
        env:
          WT_CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          WT_CHROME_NO_SANDBOX: "true"
        run: node scripts/news/title-image/smoke.mjs
  website-gates:
    name: Website build, search, privacy and URL gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 0

      - name: Prepare pinned history for release-equivalent historical checks
        run: bash scripts/ops/prepare-release-history.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test public download preservation gate
        run: node --test tests/assets/verify-existing-public-assets.test.mjs

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build dependencies
        run: python -m pip install --upgrade pip openpyxl pymupdf pypdf reportlab python-docx

      - name: Check Sachsen-Anhalt public count semantics
        run: node scripts/quality/check-sachsen-anhalt-public-count-semantics.mjs

      - name: Verify unchanged public download assets on the runner
        if: github.repository == 'sustynats/wirkungsoekonomie-produktiv'
        run: node scripts/assets/verify-existing-public-assets.mjs

      - name: Hydrate verified ticker data for this repository
        run: node scripts/news/release-hydrate.mjs
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify private release access with synthetic fixture
        run: node tests/news/private-release-runtime-fixture.mjs
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build ticker from hydrated data before quality checks
        run: npm run news:build

      - name: Wirkungsticker unit and security tests
        # Bis 16.09. lief diese Suite ausschließlich im Nachrichtenlauf, wo der
        # Testschritt jeden weiteren Schritt sperrt: ein gebrochener Test nahm
        # damit die Produktion herunter (fünf Läufe, 50 Minuten). Sie gehört vor
        # den Merge.
        run: bash scripts/news/run-isolated-unit-tests.sh

      - name: Keep rejected Parliament reference-scene candidates fail-closed (no generation)
        run: |
          node --test tests/news/parliament-reference-scene.test.mjs tests/news/parliament-reference-scene-qa.test.mjs
          node scripts/parliament/impact-visuals/check-reference-scene-candidates.mjs --expect-rejected

      - name: Verify booking and targeted search aliases without network
        run: |
          python -m venv "$RUNNER_TEMP/woek-booking-gate"
          "$RUNNER_TEMP/woek-booking-gate/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r ops/telephone-booking/requirements-ci.lock
          PY_BIN="$RUNNER_TEMP/woek-booking-gate/bin/python"
          NODE_BIN="$(command -v node)"
          mkdir -p "$RUNNER_TEMP/woek-booking-empty-home"
          sudo -n env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP/woek-booking-empty-home" PYTHONDONTWRITEBYTECODE=1 /usr/bin/unshare --net -- "$PY_BIN" -m unittest discover -s ops/telephone-booking/tests -p 'test_*.py' -v
          sudo -n env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP/woek-booking-empty-home" /usr/bin/unshare --net -- "$NODE_BIN" --check assets/js/telephone-booking.js
          sudo -n env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP/woek-booking-empty-home" /usr/bin/unshare --net -- "$NODE_BIN" --test ops/telephone-booking/tests/test_manage_hold.cjs scripts/search/booking-search-aliases.test.mjs tests/site/booking-public-asset.test.mjs tests/natalie/phone-verification.test.mjs scripts/lib/booking-verification-shell.test.mjs

      - name: Build search index
        run: npm run build:search

      - name: Ensure generated search artifacts are committed
        run: git diff --exit-code -- assets/search/search-index.json public/data/woek-search-meta.json

      - name: Build content taxonomy
        run: npm run taxonomy:build

      - name: Ensure generated taxonomy is committed
        run: git diff --exit-code -- content/taxonomy/site-map.json

      - name: Build complete site before artifact checks
        run: WOEK_PDF_BUILD_MODE=verify npm run build

      - name: Audit generated release before merge (no branch-writing projections)
        # Use the same semantic/historical gates as publication. A card-renderer
        # regression must fail here, not only after approved news wait to deploy.
        run: bash scripts/ops/audit-generated-release.sh

      - name: Build public deploy artifact
        run: npm run build:artifact
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Check public artifact privacy
        run: npm run check:privacy

      - name: Check URL baseline
        run: npm run check:url-baseline

      - name: Report internal link integrity
        run: npm run check:site-links

      - name: Check site size
        run: npm run check:size

      - name: Measure and gate navigation of the complete public artifact
        run: |
          python3 -m unittest discover -s tests/navigation -v
          node scripts/quality/check-navigation-discovery.mjs --report --gate
          cat reports/navigation/latest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Attach navigation report to this PR run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-report
          path: |
            reports/navigation/latest.json
            reports/navigation/latest.md
          if-no-files-found: warn
