name: Republish verified Pages artifact

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Completed production run whose build and release gates passed
        required: true
        type: string
      source_commit:
        description: Exact 40-character source commit of that artifact
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  republish:
    if: github.repository == 'sustynats/wirkungsoekonomie-produktiv' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify source gates and immutable artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: python3 scripts/ops/prepare-pages-republication.py
      - name: Record exact source and artifact checksums
        uses: actions/upload-artifact@v4
        with:
          name: pages-republication-provenance
          path: ${{ runner.temp }}/verified-pages-republication/provenance.json
          if-no-files-found: error
      - name: Upload the identical Pages tar
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/verified-pages-republication/artifact.tar
          compression-level: 0
          if-no-files-found: error
      - name: Publish the verified artifact
        id: deployment
        uses: actions/deploy-pages@v5
