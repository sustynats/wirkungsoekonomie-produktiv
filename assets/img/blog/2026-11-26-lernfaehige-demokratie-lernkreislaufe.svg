<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1020" viewBox="0 0 840 1020" role="img" aria-labelledby="title desc">
  <title id="title">Zwei verknüpfte Lernkreisläufe</title>
  <desc id="desc">Strategische Ebene: Zielpfad beobachten, Abweichung erkennen, Maßnahmenportfolio prüfen, politische Reaktion festlegen. Operative Ebene: Wirkmodell und Ex-ante-Prüfung, Maßnahme umsetzen, ex post evaluieren, Folgeentscheidung begründen. Eindeutige Verweise verbinden die Ebenen. Eine versionierte Lernakte mit Kennungen, Datenständen, Prüfterminen und geregelter Übergabe ist der konzeptionelle Verbindungsvorschlag des Dossiers.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse"><path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#b18435" stroke-width="1.8"/></marker></defs>
  <rect width="840" height="1020" fill="#faf8f2"/>
  <g font-family="Arial,sans-serif" fill="#0b1020">
    <text x="40" y="55" font-size="31" font-weight="700">Zwei verknüpfte Lernkreisläufe</text>
    <text x="40" y="92" font-size="22">Konzeptionelle Darstellung zu Kapitel 4.3 und 4.4</text>
    <text x="195" y="155" text-anchor="middle" fill="#174f38" font-size="28" font-weight="700">Strategische Ebene</text>
    <text x="645" y="155" text-anchor="middle" fill="#174f38" font-size="28" font-weight="700">Operative Ebene</text>
  </g>
  <g fill="#fff" stroke="#d9dfd8" stroke-width="2">
    <rect x="40" y="190" width="310" height="110" rx="8"/><rect x="490" y="190" width="310" height="110" rx="8"/>
    <rect x="40" y="340" width="310" height="110" rx="8"/><rect x="490" y="340" width="310" height="110" rx="8"/>
    <rect x="40" y="490" width="310" height="110" rx="8"/><rect x="490" y="490" width="310" height="110" rx="8"/>
    <rect x="40" y="640" width="310" height="110" rx="8"/><rect x="490" y="640" width="310" height="110" rx="8"/>
  </g>
  <g fill="none" stroke="#b18435" stroke-width="3" marker-end="url(#arrow)">
    <path d="M195 303V328"/><path d="M195 453V478"/><path d="M195 603V628"/>
    <path d="M645 303V328"/><path d="M645 453V478"/><path d="M645 603V628"/>
    <path d="M195 753V782H20V172H195V180"/><path d="M645 753V782H820V172H645V180"/>
    <path d="M195 786V841"/><path d="M645 786V841"/>
  </g>
  <path d="M365 553H475" fill="none" stroke="#b18435" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#0b1020" font-size="29" font-weight="600">
    <text x="195" y="237"><tspan x="195">Zielpfad</tspan><tspan x="195" dy="36">beobachten</tspan></text>
    <text x="195" y="387"><tspan x="195">Abweichung</tspan><tspan x="195" dy="36">erkennen</tspan></text>
    <text x="195" y="537" font-size="27"><tspan x="195">Maßnahmenportfolio</tspan><tspan x="195" dy="36">prüfen</tspan></text>
    <text x="195" y="687"><tspan x="195">Politische Reaktion</tspan><tspan x="195" dy="36">festlegen</tspan></text>
    <text x="645" y="237"><tspan x="645">Wirkmodell und</tspan><tspan x="645" dy="36">Ex-ante-Prüfung</tspan></text>
    <text x="645" y="387"><tspan x="645">Maßnahme</tspan><tspan x="645" dy="36">umsetzen</tspan></text>
    <text x="645" y="537"><tspan x="645">Ex post</tspan><tspan x="645" dy="36">evaluieren</tspan></text>
    <text x="645" y="687"><tspan x="645">Folgeentscheidung</tspan><tspan x="645" dy="36">begründen</tspan></text>
  </g>
  <text x="420" y="530" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#174f38">Verweise</text>
