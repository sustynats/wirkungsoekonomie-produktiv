<svg xmlns="http://www.w3.org/2000/svg" width="840" height="820" viewBox="0 0 840 820" role="img" aria-labelledby="title desc"><title id="title">Lernfähige Demokratie: acht vorgeschlagene Verfahrensschritte</title><desc id="desc">Problem klären → Ziele demokratisch begründen → Wirkmodell und Alternativen formulieren → Ex-ante-Prüfung veröffentlichen → Demokratisch entscheiden → Umsetzen und monitoren → Ex post evaluieren → Reaktion öffentlich verantworten. Konzeptioneller Vorschlag, kein Wirkungsnachweis.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#b18435" stroke-width="1.8"/></marker></defs><rect width="840" height="820" fill="#faf8f2"/><path d="M375,113 L453,113" fill="none" stroke="#b18435" stroke-width="3" marker-end="url(#a)"/><path d="M620,186 L620,223" fill="none" stroke="#b18435" stroke-width="3" marker-end="url(#a)"/><path d="M465,308 L387,308" fill="none" stroke="#b18435" stroke-width="3" marker-end="url(#a)"/><path d="M220,381 L220,418" fill="none" stroke="#b18435" stroke-width="3" marker-end="url(#a)"/><path d="M375,503 L453,503" fill="none" stroke="#b18435" stroke-width="3" marker-end="url(#a)"/><path d="M620,576 L620,613" fill="none" stroke="#b18435" stroke-width="3" marker-end="url(#a)"/><path d="M465,698 L387,698" fill="none" stroke="#b18435" stroke-width="3" marker-end="url(#a)"/><rect x="65" y="40" width="310" height="146" rx="8" fill="#fff" stroke="#d9dfd8" stroke-width="2"/><circle cx="95" cy="70" r="17" fill="#174f38"/><text x="95" y="76" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="19" font-weight="700">1</text><text x="85" y="125" fill="#0b1020" font-family="Arial,sans-serif" font-size="30" font-weight="600">Problem</text><text x="85" y="156" fill="#0b1020" font-family="Arial,sans-serif" font-size="30" font-weight="600">klären</text><rect x="465" y="40" width="310" height="146" rx="8" fill="#fff" stroke="#d9dfd8" stroke-width="2"/><circle cx="495" cy="70" r="17" fill="#174f38"/><text x="495" y="76" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="19" font-weight="700">2</text><text x="485" y="125" fill="#0b1020" font-family="Arial,sans-serif" font-size="30" font-weight="600">Ziele demokratisch</text><text x="485" y="156" fill="#0b1020" font-family="Arial,sans-serif" font-size="30" font-weight="600">begründen</text><rect x="465" y="235" width="310" height="146" rx="8" fill="#fff" stroke="#d9dfd8" stroke-width="2"/><circle cx="495" cy="265" r="17" fill="#174f38"/><text x="495" y="271" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="19" font-weight="700">3</text><text x="485" y="303" fill="#0b1020" font-family="Arial,sans-serif" font-size="30" font-weight="600">Wirkmodell und</text><text x="485" y="332" fill="#0b1020" font-family="Arial,sans-serif" font-size="30" font-weight="600">Alternativen</text><text x="485" y="361" fill="#0b1020" font-family="Arial,sans-serif" font-size="30" font-weight="600">formulieren</text><rect x="65" y="235" width="310" height="146" rx="8" fill="#fff" stroke="#d9dfd8" stroke-width="2"/><circle cx="95" cy="265" r="17" fill="#174f38"/><text x="95" y="271" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="19" font-weight="700">4</text><text x="85" y="320" fill="#0b1020" font-family="Arial,sans-serif" font-size="30" font-weight="600">Ex-ante-Prüfung</text><text x="85" y="351" fill="#0b1020" font-family="Arial,sans-serif" font-size="30" font-weight="600">veröffentlichen</text><rect x="65" y="430" width="310" height="146" rx="8" fill="#fff" stroke="#d9dfd8" stroke-width="2"/><circle cx="95" cy="460" r="17" fill="#174f38"/><text x="95" y="466" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="19" font-weight="700">5</text><text x="85" y="515" fill="#0b1020" font-family="Arial,sans-serif" font-size="30" font-weight="600">Demokratisch</text><text x="85" y="546" fill="#0b1020" font-family="Arial,sans-serif" font-size="30" font-weight="600">entscheiden</text><rect x="465" y="430" width="310" height="146" rx="8" fill="#fff" stroke="#d9dfd8" stroke-width="2"/><circle cx="495" cy="460" r="17" fill="#174f38"/><text x="495" y="466" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="19" font-weight="700">6</text><text x="485" y="515" fill="#0b1020" font-family="Arial,sans-serif" font-size="30" font-weight="600">Umsetzen und</text><text x="485" y="546" fill="#0b1020" font-family="Arial,sans-serif" font-size="30" font-weight="600">monitoren</text><rect x="465" y="625" width="310" height="146" rx="8" fill="#fff" stroke="#d9dfd8" stroke-width="2"/><circle cx="495" cy="655" r="17" fill="#174f38"/><text x="495" y="661" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="19" font-weight="700">7</text><text x="485" y="710" fill="#0b1020" font-family="Arial,sans-serif" font-size="30" font-weight="600">Ex post</text><text x="485" y="741" fill="#0b1020" font-family="Arial,sans-serif" font-size="30" font-weight="600">evaluieren</text><rect x="65" y="625" width="310" height="146" rx="8" fill="#fff" stroke="#d9dfd8" stroke-width="2"/><circle cx="95" cy="655" r="17" fill="#174f38"/><text x="95" y="661" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="19" font-weight="700">8</text><text x="85" y="710" fill="#0b1020" font-family="Arial,sans-serif" font-size="30" font-weight="600">Reaktion öffentlich</text><text x="85" y="741" fill="#0b1020" font-family="Arial,sans-serif" font-size="30" font-weight="600">verantworten</text></svg>